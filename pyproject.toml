[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "list-smith-mcp"
version = "0.1.1"
description = "MCP server for ListSmith — pay-per-call x402 listing grades and repairs over x402 ($0.10 / $0.50 USDC on Base)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Jobfile Studio" }]
keywords = ["mcp", "x402", "base", "usdc", "bazaar", "listing", "discovery", "agents"]
dependencies = [
    # mcp 2.x renamed FastMCP -> MCPServer; this package targets the v1
    # SDK API that current MCP hosts and docs are built against.
    "mcp>=1.2,<2",
    "httpx>=0.27",
    "eth-account>=0.11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
list-smith-mcp = "list_smith_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/list_smith_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
